services:
  janus:
    image: canyan/janus-gateway:1.3.2
    restart: unless-stopped
    command: ["janus", "-F", "/usr/local/etc/janus"]
    ports:
      - "${JANUS_HTTP_PORT:-8088}:8088/tcp"
      - "${JANUS_WS_PORT:-8188}:8188/tcp"
      - "10000-10100:10000-10100/udp"
    volumes:
      - ./janus:/usr/local/etc/janus:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8088/janus/info >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      janus:
        condition: service_healthy
    environment:
      LISTEN_ADDR: ":8080"
      DATABASE_PATH: /var/lib/intercom/intercom.db
      JANUS_WS_URL: ws://janus:8188
      JANUS_API_SECRET: ${JANUS_API_SECRET:-}
      JANUS_ADMIN_KEY: ${JANUS_ADMIN_KEY:-}
      DEVICE_TOKENS: ${DEVICE_TOKENS:?set DEVICE_TOKENS in deploy/.env}
      LINX_WS_URL: ${LINX_WS_URL:-wss://xrobo-io.qiniuapi.com/v1/ws/}
      LINX_DEVICE_TOKENS: ${LINX_DEVICE_TOKENS:-{}}
      MCP_API_TOKEN: ${MCP_API_TOKEN:?set MCP_API_TOKEN in deploy/.env}
    ports:
      - "${INTERCOM_HTTP_PORT:-8080}:8080/tcp"
    volumes:
      - intercom-data:/var/lib/intercom
    healthcheck:
      test: ["CMD", "/usr/local/bin/intercom-server", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  intercom-data:
