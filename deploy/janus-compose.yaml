services:
  janus:
    image: canyan/janus-gateway:1.3.2
    restart: unless-stopped
    command: ["janus", "-F", "/usr/local/etc/janus"]
    ports:
      - "8088:8088/tcp"
      - "8188:8188/tcp"
      - "10000-10100:10000-10100/udp"
    volumes:
      - ./janus/janus.jcfg:/usr/local/etc/janus/janus.jcfg:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8088/janus/info >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
